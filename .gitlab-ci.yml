# GitLab CI — builds and publishes the aarch64 image with the app-announcer.
#
# Why a native arm64 runner: the runtime base image
# (registry.gitlab.com/lucas.perovani/app-announcer) is arm64, so the final
# image must be arm64. Building that on an x86 runner requires QEMU emulation
# for every compilation step — roughly 10-20x slower, and QEMU frequently
# breaks on Rust build scripts. `saas-linux-small-arm64` is available on the
# free tier, so the job runs natively instead.
#
# Desktop builds for other platforms live in GitHub Actions.
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   CI_REGISTRY_*     provided automatically by GitLab
#   The registry credentials are the job token; no extra secret is needed.
stages:
  - build

variables:
  TARGET: aarch64-unknown-linux-musl
  IMAGE_TAG: latest
  # Buildah keeps its store in $HOME by default. Moving it inside the project
  # directory keeps everything on the runner's working disk.
  #
  # These are `buildah --root` / `--runroot` values, not storage.conf options:
  # passing `graphroot` through STORAGE_OPTS fails with
  # `unknown option "graphroot"`.
  BUILDAH_ROOT: "$CI_PROJECT_DIR/.buildah/storage"
  BUILDAH_RUNROOT: "$CI_PROJECT_DIR/.buildah/runroot"
  # Cache mounts (`RUN --mount=type=cache`) live under $TMPDIR, not in the
  # store. Keeping them inside the project directory puts them on the runner's
  # working disk alongside everything else.
  TMPDIR: "$CI_PROJECT_DIR/.buildah/tmp"

# The Rust dependency cache lives in `RUN --mount=type=cache` (see Dockerfile),
# not in buildah's store.
#
# IMPORTANT: this job used to cache `.buildah/` — the whole buildah store.
# With the `vfs` driver that store holds a full copy of the rootfs per layer, so
# restoring it cost more than it saved and the job ran out of disk
# ("no space left on device").
#
# Cache mounts persist on the runner's own disk and never enter a layer, which
# is the mechanism that fits. They do not survive a pipeline, because each job
# gets a fresh VM; a from-scratch dependency build takes about 6.5 minutes, which
# is the accepted cost of not shipping multi-GB caches around.

build-arm64:
  stage: build
  # Native arm64 runner: no emulation, so the Rust toolchain and every build
  # script run at full speed. Privileged by default, which buildah needs.
  tags:
    - saas-linux-small-arm64
  image: quay.io/buildah/stable:latest
  variables:
    # The overlay driver needs a privileged runner; vfs works everywhere and
    # avoids "overlay on overlay" failures inside the executor container.
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
  before_script:
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - mkdir -p "$TMPDIR" "$BUILDAH_ROOT" "$BUILDAH_RUNROOT"
    # Surface the runner's disk situation: `no space left on device` mid-build
    # is otherwise hard to attribute.
    - df -h "$CI_PROJECT_DIR" | tail -1
  script:
    # `--layers` is deliberately NOT used.
    #
    # It caches one intermediate image per instruction, and with the `vfs`
    # driver each of those is a *full copy* of the rootfs — hundreds of MB to
    # several GB each. The runner provisions a fresh VM per job, so those layers
    # are never reused across pipelines: all that disk is spent on nothing.
    #
    # Dependency reuse comes from the cache mounts in the Dockerfile instead,
    # which keep the Cargo registry and `target/` outside the image layers.
    - >
      buildah --root "$BUILDAH_ROOT" --runroot "$BUILDAH_RUNROOT"
      build
      --build-arg TARGET=$TARGET
      -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      -f Dockerfile .
    # The same store flags are required here: push reads the image from the
    # storage root, and without them it would look in $HOME and find nothing.
    - >
      buildah --root "$BUILDAH_ROOT" --runroot "$BUILDAH_RUNROOT"
      push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    # Report the final image size; it is the number that matters for deployment.
    - >
      buildah --root "$BUILDAH_ROOT" --runroot "$BUILDAH_RUNROOT"
      images --format '{{.Name}} {{.Size}}' | grep auren || true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
