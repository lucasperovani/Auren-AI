# GitLab CI — builds and publishes the aarch64 image with the app-announcer.
#
# Why a native arm64 runner: the runtime base image
# (registry.gitlab.com/lucas.perovani/app-announcer) is arm64, so the final
# image must be arm64. Building that on an x86 runner requires QEMU emulation
# for every compilation step — roughly 10-20x slower, and QEMU frequently
# breaks on Rust build scripts. `saas-linux-small-arm64` is available on the
# free tier, so the job runs natively instead.
#
# Desktop builds for other platforms live in GitHub Actions.
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   CI_REGISTRY_*     provided automatically by GitLab
#   The registry credentials are the job token; no extra secret is needed.
stages:
  - build

variables:
  TARGET: aarch64-unknown-linux-musl
  IMAGE_TAG: latest
  # Buildah keeps its store in $HOME by default. Pointing it at the project
  # directory lets GitLab's cache preserve images and layer cache between jobs.
  BUILDAH_STORE: "$CI_PROJECT_DIR/.buildah"

# Persist buildah's store between jobs. The key follows the two files that
# actually change the dependency graph, so an unrelated commit reuses the cache
# while a manifest change starts a fresh one.
cache:
  key:
    files:
      - Dockerfile
      - Cargo.lock
  paths:
    - .buildah/

build-arm64:
  stage: build
  # Native arm64 runner: no emulation, so the Rust toolchain and every build
  # script run at full speed. Privileged by default, which buildah needs.
  tags:
    - saas-linux-small-arm64
  image: quay.io/buildah/stable:latest
  variables:
    # The overlay driver needs a privileged runner; vfs works everywhere and
    # avoids "overlay on overlay" failures inside the executor container.
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
  before_script:
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # Redirect the container store into the cached directory. Exported here
    # rather than in `variables:` because it needs shell expansion.
    - export STORAGE_OPTS="graphroot=$BUILDAH_STORE/storage runroot=$BUILDAH_STORE/runroot"
    # NOTE: every item is quoted. An unquoted `echo "text: more"`
    # contains ": " which YAML reads as a key/value separator, turning the
    # item into a mapping — and GitLab then rejects before_script with
    # "should be a string or a nested array of strings".
    - if [ -d "$BUILDAH_STORE" ]; then du -sh "$BUILDAH_STORE"; else echo "cache cold, building from scratch"; fi
  script:
    # NOTE on caching flags: buildah rejects a tag in `--cache-from` and
    # `--cache-to` ("repository must contain neither a tag nor digest"),
    # unlike docker buildx. Both are omitted here.
    #
    # Layer reuse comes from the persisted buildah store (`--layers` plus the
    # `cache:` block above): the Dockerfile is written so a code-only change
    # reuses the dependency layer, which is where nearly all the time goes.
    - >
      buildah build
      --layers
      --build-arg TARGET=$TARGET
      -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      -f Dockerfile .
    - buildah push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
