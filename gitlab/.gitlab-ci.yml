stages:
  - build

build-and-push:
  stage: build
  image: quay.io/buildah/stable:latest
  variables:
    STORAGE_DRIVER: vfs
  before_script:
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # Build para aarch64 (target musl para binário estático).
    # A imagem base do runtime (app-announcer) é arm64, então a imagem final
    # precisa ser aarch64 — o --arch abaixo garante isso.
    - >
      buildah build --arch aarch64
      --build-arg TARGET=aarch64-unknown-linux-musl
      -t "$CI_REGISTRY_IMAGE:latest" -f Dockerfile .
    - buildah push "$CI_REGISTRY_IMAGE:latest"
  after_script:
    # Torna o projeto público automaticamente usando a API do GitLab
    - >
      curl --fail --silent --show-error --request PUT
      --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"
      --data "visibility=public"
      || echo "Aviso: não foi possível alterar a visibilidade do projeto via API"
  only:
    - master
    - main